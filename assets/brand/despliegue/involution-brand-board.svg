  <style>
    @font-face{font-family:GeistBrand;src:url("fonts/Geist-Bold.ttf")} .title{font-family:GeistBrand,Geist,Arial,sans-serif;font-weight:700}.meta{font-family:monospace;letter-spacing:2px}
  </style>
  <rect width="1600" height="1000" fill="#eef1f6"/>
