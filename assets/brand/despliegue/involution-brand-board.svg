  <text class="meta" x="1552" y="52" fill="#606774" font-size="15" text-anchor="end">V01</text>

  <rect x="40" y="88" width="1000" height="390" rx="4" fill="#fff"/>
  <text class="meta" x="74" y="130" fill="#6b7280" font-size="14">PRIMARY / LIGHT</text>
  <image href="involution-logo-horizontal-color.svg" x="104" y="182" width="830" height="230"/>

